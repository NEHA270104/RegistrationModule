steps:
  # Build the Docker image from the backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bizflow-registration:$BUILD_ID'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bizflow-registration:$BUILD_ID'

  # Deploy to Cloud Run with secrets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bizflow-registration'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bizflow-registration:$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,ADMIN_API_KEY=ADMIN_API_KEY:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,MSG91_AUTH_KEY=MSG91_AUTH_KEY:latest'
      - '--set-env-vars'
      - 'NODE_ENV=production,MSG91_DOMAIN=registration.bizflowai.in,MSG91_FROM_EMAIL=noreply@registration.bizflowai.in,MSG91_TEMPLATE_REGISTRATION=registration_confirmation_14,MSG91_TEMPLATE_REMINDER=payment_recovery_email,MSG91_TEMPLATE_RECOVERY=payment_recovery_email,MSG91_TEMPLATE_Waitlist=bizflow_template_waitlist'
      - '--timeout'
      - '60'

options:
  logging: CLOUD_LOGGING_ONLY
