<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <h1>Tenant Dashboard</h1>
                <p>Sign in to manage your registration events</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <div id="login-error" class="login-error" style="display:none;"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard Shell -->
    <div id="dashboard-shell" class="dashboard-shell" style="display:none;">

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <h2 id="sidebar-tenant-name">Dashboard</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="overview">
                    <i class="fas fa-chart-line"></i><span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-section="registrations">
                    <i class="fas fa-users"></i><span>Registrations</span>
                </a>
                <a href="#" class="nav-item" data-section="event-settings">
                    <i class="fas fa-cog"></i><span>Event Settings</span>
                </a>
                <a href="#" class="nav-item" data-section="guests">
                    <i class="fas fa-user-tie"></i><span>Guests</span>
                </a>
                <a href="#" class="nav-item" data-section="benefits">
                    <i class="fas fa-gift"></i><span>Benefits</span>
                </a>
                <a href="#" class="nav-item" data-section="abandonments">
                    <i class="fas fa-exclamation-triangle"></i><span>Payment Recovery</span>
                </a>
                <a href="#" class="nav-item" data-section="subscription">
                    <i class="fas fa-crown"></i><span>Subscription</span>
                </a>
                <a href="#" class="nav-item" data-section="rebrand">
                    <i class="fas fa-paint-brush"></i><span>Custom Branding</span>
                </a>
                <a href="#" class="nav-item" data-section="referral">
                    <i class="fas fa-share-alt"></i><span>Referral Program</span>
                </a>
                <a href="#" class="nav-item" data-section="flyers">
                    <i class="fas fa-image"></i><span>Flyer Generator</span>
                </a>
                <a href="#" class="nav-item" data-section="email-templates">
                    <i class="fas fa-envelope"></i><span>Email Templates</span>
                </a>
                <a href="#" class="nav-item" data-section="analytics">
                    <i class="fas fa-chart-bar"></i><span>Analytics</span>
                </a>
                <a href="#" class="nav-item" data-section="activity-log">
                    <i class="fas fa-clipboard-list"></i><span>Activity Log</span>
                </a>
                <a href="#" class="nav-item" data-section="settings">
                    <i class="fas fa-sliders-h"></i><span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <button id="sidebar-toggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-right">
                    <span class="header-user" id="header-user-name">
                        <i class="fas fa-user-circle"></i> <span></span>
                    </span>
                    <button id="logout-btn" class="btn btn-sm btn-outline">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <main id="main-content" class="main-content">
                <!-- Sections are injected here by JS -->
            </main>
        </div>
    </div>

    <!-- Global Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal" id="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="modal-close" id="modal-close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>

    <script src="js/dashboard-auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
