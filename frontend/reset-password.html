<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Tenant Dashboard</title>
    <link rel="stylesheet" href="/dashboard/css/dashboard.css?v=1.0.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i data-lucide="key-round"></i>
                </div>
                <h1>Reset Password</h1>
                <p>Choose a secure, new password for your account</p>
            </div>
            
            <form id="reset-form" class="login-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" placeholder="Minimum 8 characters" required minlength="8">
                        <i data-lucide="eye" class="password-toggle-btn" id="toggle-new-password"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="Re-enter new password" required minlength="8">
                        <i data-lucide="eye" class="password-toggle-btn" id="toggle-confirm-password"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="reset-btn">
                    <span class="btn-text">Reset Password</span>
                    <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                
                <div id="reset-error" class="login-error" style="display:none; margin-top: 16px;"></div>
                <div id="reset-success" style="display:none; text-align: center; color: var(--success); font-weight: 600; margin-top: 16px; font-size: 14px;">
                    Password reset successfully! Redirecting to login...
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide Icons
            if (window.lucide) {
                lucide.createIcons();
            }

            const resetForm = document.getElementById('reset-form');
            const errorEl = document.getElementById('reset-error');
            const successEl = document.getElementById('reset-success');
            const resetBtn = document.getElementById('reset-btn');
            
            // Get reset token from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                errorEl.textContent = 'Invalid recovery token. Please start the Forgot Password flow again.';
                errorEl.style.display = 'block';
                resetBtn.disabled = true;
                return;
            }

            // Password visibility toggle helpers
            setupPasswordToggle('toggle-new-password', 'new-password');
            setupPasswordToggle('toggle-confirm-password', 'confirm-password');

            function setupPasswordToggle(toggleId, inputId) {
                const toggle = document.getElementById(toggleId);
                const input = document.getElementById(inputId);
                
                if (toggle && input) {
                    toggle.addEventListener('click', () => {
                        if (input.type === 'password') {
                            input.type = 'text';
                            toggle.setAttribute('data-lucide', 'eye-off');
                        } else {
                            input.type = 'password';
                            toggle.setAttribute('data-lucide', 'eye');
                        }
                        if (window.lucide) {
                            lucide.createIcons();
                        }
                    });
                }
            }

            // Form Submit Handler
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (newPassword.length < 8) {
                    errorEl.textContent = 'Password must be at least 8 characters long';
                    errorEl.style.display = 'block';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    errorEl.textContent = 'Passwords do not match. Please verify.';
                    errorEl.style.display = 'block';
                    return;
                }

                // Show spinner
                resetBtn.querySelector('.btn-text').style.display = 'none';
                resetBtn.querySelector('.btn-spinner').style.display = 'inline';
                resetBtn.disabled = true;

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            resetToken: token,
                            password: newPassword
                        })
                    });

                    const result = await response.json();
                    
                    if (!response.ok || !result.success) {
                        throw new Error(result.error?.message || result.message || 'Failed to reset password');
                    }

                    // Success
                    successEl.style.display = 'block';
                    
                    // Redirect to login page in 3 seconds
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2500);

                } catch (err) {
                    errorEl.textContent = err.message;
                    errorEl.style.display = 'block';
                    
                    resetBtn.querySelector('.btn-text').style.display = 'inline';
                    resetBtn.querySelector('.btn-spinner').style.display = 'none';
                    resetBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
